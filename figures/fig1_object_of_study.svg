<text fill="#1A1A1F" style="white-space: pre" xml:space="preserve" font-family="STIX Two Text, STIX" font-size="13" letter-spacing="0em"><tspan x="558.278" y="300.906"> The device refuses on measured charge, </tspan><tspan x="450" y="315.906">which bounds its overdraw.</tspan></text>
<text fill="#1A1A1F" style="white-space: pre" xml:space="preserve" font-family="STIX Two Text, STIX" font-size="13" font-weight="bold" letter-spacing="0em"><tspan x="450" y="300.906">Client-side check.</tspan></text>
