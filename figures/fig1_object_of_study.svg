<text fill="#1A1A1F" style="white-space: pre" xml:space="preserve" font-family="STIX Two Text, STIX" font-size="13" font-weight="bold" letter-spacing="0em"><tspan x="450" y="260.906">Server-side filter.</tspan></text>
