<text fill="#1A1A1F" style="white-space: pre" xml:space="preserve" font-family="STIX Two Text, STIX" font-size="13" letter-spacing="0em"><tspan x="149.48" y="300.906"> The held-out devices are redrawn for every </tspan><tspan x="50" y="315.906">seed.</tspan></text>
