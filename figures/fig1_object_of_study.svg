<text fill="#1A1A1F" style="white-space: pre" xml:space="preserve" font-family="STIX Two Text, STIX" font-size="13" letter-spacing="0em"><tspan x="110.658" y="260.906"> The deployed model is reported, not an average </tspan><tspan x="50" y="275.906">over the last rounds.</tspan></text>
